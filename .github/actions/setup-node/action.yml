name: Set up Node and dependencies
description: Installs pnpm and Node.js (with the pnpm store cached) and the locked dependencies. Every Verify job starts here, so the versions live in one place.

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6.0.8

    - name: Install Node.js
      uses: actions/setup-node@v7.0.0
      with:
        node-version: 24
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
