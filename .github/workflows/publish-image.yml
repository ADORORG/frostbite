name: Publish image

# Builds deploy/Dockerfile once and pushes it to the GitHub Container Registry, so a small server only pulls the image and never builds it
# (docs/operations/deployment.md, "Prebuilt image"), then asks Coolify to deploy it. The Verify workflow (ci.yml) calls this on a push to
# main or dev once its own jobs have passed, so a commit that fails Verify is neither published nor deployed. Run by hand (workflow_dispatch)
# it skips that check: use it only to republish a commit already known to be good.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to the registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the image and its tags
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          # The default target is `web`; the worker runs the same image with its own start command.
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploys the image just pushed. It does nothing until the repository has the secrets COOLIFY_URL (the https address of Coolify) and
      # COOLIFY_TOKEN (an API token allowed to deploy) and the variables COOLIFY_APP_UUID and COOLIFY_DEPLOY_BRANCH (the branch whose
      # image that application runs), so a fork or a branch that is not deployed only publishes.
      - name: Ask Coolify to deploy the new image
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          REPOSITORY_VARIABLES: ${{ toJSON(vars) }}
        run: |
          # One Coolify application per branch: the variable COOLIFY_APP_UUID_<BRANCH> (dev -> COOLIFY_APP_UUID_DEV) names it.
          variable="COOLIFY_APP_UUID_$(printf '%s' "$GITHUB_REF_NAME" | tr 'a-z' 'A-Z' | tr -c 'A-Z0-9\n' '_')"
          COOLIFY_APP_UUID="$(printf '%s' "$REPOSITORY_VARIABLES" | jq -r --arg name "$variable" '.[$name] // empty')"
          if [ -z "$COOLIFY_URL" ] || [ -z "$COOLIFY_TOKEN" ] || [ -z "$COOLIFY_APP_UUID" ]; then
            echo "Not deploying: Coolify is not configured for the branch $GITHUB_REF_NAME ($variable is not set). The image is published."
            exit 0
          fi
          case "$COOLIFY_URL" in
            https://*) ;;
            *) echo "::error::COOLIFY_URL must start with https:// so the token is not sent in the clear."; exit 1 ;;
          esac
          curl --fail-with-body --silent --show-error --max-time 60 \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_URL%/}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=false"
