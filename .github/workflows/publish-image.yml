name: Publish image

# Builds deploy/Dockerfile once and pushes it to the GitHub Container Registry, so a small server only pulls the image and never builds it
# (docs/operations/deployment.md, "Prebuilt image"). It does not run the Verify workflow: merge only what Verify passes.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to the registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the image and its tags
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          # The default target is `web`; the worker runs the same image with its own start command.
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploys the image just pushed. It does nothing until the repository has the secrets COOLIFY_URL (the https address of Coolify) and
      # COOLIFY_TOKEN (an API token allowed to deploy) and the variables COOLIFY_APP_UUID and COOLIFY_DEPLOY_BRANCH (the branch whose
      # image that application runs), so a fork or a branch that is not deployed only publishes.
      - name: Ask Coolify to deploy the new image
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
          COOLIFY_DEPLOY_BRANCH: ${{ vars.COOLIFY_DEPLOY_BRANCH }}
        run: |
          if [ -z "$COOLIFY_URL" ] || [ -z "$COOLIFY_TOKEN" ] || [ -z "$COOLIFY_APP_UUID" ] || [ "$GITHUB_REF_NAME" != "$COOLIFY_DEPLOY_BRANCH" ]; then
            echo "Not deploying: Coolify is not configured for the branch $GITHUB_REF_NAME. The image is published."
            exit 0
          fi
          case "$COOLIFY_URL" in
            https://*) ;;
            *) echo "::error::COOLIFY_URL must start with https:// so the token is not sent in the clear."; exit 1 ;;
          esac
          curl --fail-with-body --silent --show-error --max-time 60 \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_URL%/}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=false"
