name: Publish image

# Builds deploy/Dockerfile once and pushes it to the GitHub Container Registry, so a small server only pulls the image and never builds it
# (docs/operations/deployment.md, "Prebuilt image"). It does not run the Verify workflow: merge only what Verify passes.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to the registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the image and its tags
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          # The default target is `web`; the worker runs the same image with its own start command.
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
