[package]
name = "game-rewards-harness"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Runs the contracts through the Alkanes indexer (`index_block`, the mainnet code path) under
# `wasm-bindgen-test-runner`. Build the contracts first: `tests/support` embeds their wasm.
[dev-dependencies]
alkanes = { git = "https://github.com/kungfuflex/alkanes-rs", rev = "62511e9371a3f9e448841140c51cfe428cfcb955", features = ["test-utils"] }
protorune = { git = "https://github.com/kungfuflex/alkanes-rs", rev = "62511e9371a3f9e448841140c51cfe428cfcb955", features = ["test-utils"] }
protorune-support = { git = "https://github.com/kungfuflex/alkanes-rs", rev = "62511e9371a3f9e448841140c51cfe428cfcb955" }
alkanes-support = { workspace = true }
metashrew-core = { git = "https://github.com/kungfuflex/metashrew", tag = "v9.0.5-rc.8", features = ["test-utils"] }
rewards-core = { workspace = true }
anyhow = { workspace = true }
bitcoin = { version = "0.32.4", features = ["rand"] }
wasm-bindgen-test = "=0.3.50"
serde_json = { workspace = true }

