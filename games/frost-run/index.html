<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Frost Run</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="main">
      <div class="bar">
        <header>
          <h1>Frost Run</h1>
          <p id="status">Connecting to the platform…</p>
        </header>
        <p class="score">
          <span class="read-run">Round <strong id="round">1/3</strong></span>
          <span class="read-run read-time"
            >Time <strong id="time">60</strong></span
          >
          <span class="read-run read-crystal"
            ><i class="glyph" data-kind="crystal"></i
            ><strong id="crystals">0/8</strong></span
          >
          <span class="read-run"
            ><i class="glyph" data-kind="egg"></i
            ><strong id="eggs">0/5</strong></span
          >
          <span class="read-run"
            ><i class="glyph" data-kind="key"></i
            ><strong id="keys">0/4</strong></span
          >
          <span class="read-best">Best <strong id="best">0</strong></span>
        </p>
      </div>

      <div class="stage" id="stage">
        <canvas
          id="screen"
          role="img"
          aria-label="The game screen: a hero on a floe of ice at night, gathering crystals, eggs and keys while snowballs roll in"
        ></canvas>
        <div class="frost" aria-hidden="true"></div>
        <div class="flash" id="flash" aria-hidden="true"></div>
        <div class="stick" aria-hidden="true"><div class="knob"></div></div>

        <div class="hud" aria-hidden="true">
          <div class="gauges">
            <div class="gauge" data-kind="crystal">
              <i class="glyph" data-kind="crystal"></i>
              <span class="track"
                ><span class="fill"></span><span class="goal"></span
              ></span>
              <span class="count">0/22</span>
            </div>
            <div class="gauge" data-kind="egg">
              <i class="glyph" data-kind="egg"></i>
              <span class="track"
                ><span class="fill"></span><span class="goal"></span
              ></span>
              <span class="count">0/14</span>
            </div>
            <div class="gauge" data-kind="key">
              <i class="glyph" data-kind="key"></i>
              <span class="track"
                ><span class="fill"></span><span class="goal"></span
              ></span>
              <span class="count">0/11</span>
            </div>
          </div>
          <div class="powers">
            <span class="power" data-power="roll" data-round="1"
              ><kbd>Shift</kbd>Roll</span
            >
            <span class="power" data-power="shoot" data-round="1"
              ><kbd>F</kbd>Shoot</span
            >
            <span class="power" data-power="grow" data-round="2"
              ><kbd>G</kbd>Grow</span
            >
            <span class="power" data-power="vision" data-round="2"
              ><kbd>V</kbd>Frost vision</span
            >
          </div>
          <div class="banner">
            <strong class="title"></strong><span class="line"></span>
          </div>
          <div class="toast"></div>
        </div>

        <section class="panel select" id="select" aria-label="Choose your hero">
          <p class="eyebrow">Choose your hero</p>
          <div class="picker">
            <button
              type="button"
              class="nav"
              data-part="previous"
              aria-label="Previous hero"
            >
              ‹
            </button>
            <div class="who">
              <h2 data-part="name"></h2>
              <p class="kind" data-part="kind"></p>
            </div>
            <button
              type="button"
              class="nav"
              data-part="next"
              aria-label="Next hero"
            >
              ›
            </button>
          </div>
          <div class="dots" data-part="dots" aria-hidden="true"></div>
          <div class="stats" data-part="stats"></div>
          <p class="signature" data-part="signature"></p>
          <p class="story" data-part="story"></p>
          <p class="swipe" data-part="swipe"></p>
          <button type="button" class="primary" data-part="play"></button>
        </section>

        <section
          class="panel result"
          id="result"
          aria-label="How the run went"
          hidden
        >
          <h2 class="verdict" data-part="verdict"></h2>
          <p class="who" data-part="who"></p>
          <ul class="haul" data-part="haul"></ul>
          <ul class="rounds" data-part="rounds"></ul>
          <ul class="chips" data-part="earned"></ul>
          <p class="tap" data-part="tap"></p>
          <div class="row">
            <button type="button" class="primary" data-part="again"></button>
            <button type="button" data-part="share"></button>
            <button type="button" data-part="change"></button>
          </div>
        </section>

        <section class="panel share" id="share" aria-label="Share card" hidden>
          <img data-part="card" alt="" />
          <p class="hint" data-part="hint"></p>
          <div class="row">
            <button type="button" data-part="square"></button>
            <button type="button" data-part="story"></button>
            <button type="button" data-part="close"></button>
          </div>
        </section>
      </div>

      <div class="foot">
        <div id="sound"></div>
        <p id="note" aria-live="polite"></p>
        <div class="actions">
          <button id="start" type="button" disabled>Start run</button>
          <button id="pause" type="button" disabled>Pause</button>
        </div>
      </div>
      <section aria-labelledby="earned-title">
        <h2 id="earned-title">Earned this run</h2>
        <ul id="earned" aria-label="Milestones earned this run"></ul>
      </section>
    </main>
    <script src="main.js"></script>
  </body>
</html>
