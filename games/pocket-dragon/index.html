<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pocket Dragon: Glitchy's Quest</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <div class="bar">
        <header>
          <h1>Pocket Dragon: Glitchy's Quest</h1>
          <p id="status">Connecting to the platform…</p>
          <p id="bank">Metaplasma banked: <strong id="banked">0</strong></p>
        </header>
        <p class="score">
          <span>Score <strong id="score">0</strong></span>
          <span
            ><span id="stat-0-label">Eggs</span>
            <strong id="stat-0">0</strong></span
          >
          <span
            ><span id="stat-1-label">Hearts</span>
            <strong id="stat-1">3</strong></span
          >
          <span
            ><span id="stat-2-label">Stage</span>
            <strong id="stat-2">1 of 3</strong></span
          >
          <span>Plasma <strong id="plasma">0</strong></span>
          <span>Best <strong id="best">0</strong></span>
        </p>
      </div>
      <nav id="chapters" class="chapters" aria-label="Chapters">
        <button type="button" data-chapter="hills" aria-pressed="true">
          <span aria-hidden="true">1</span> Egg Hills
        </button>
        <button
          type="button"
          data-chapter="woods"
          aria-pressed="false"
          disabled
        >
          <span aria-hidden="true">2</span> The Whispering Woods
        </button>
        <button
          type="button"
          data-chapter="castle"
          aria-pressed="false"
          disabled
        >
          <span aria-hidden="true">3</span> The Guild and the Castle
        </button>
      </nav>
      <canvas
        id="screen"
        width="512"
        height="288"
        role="img"
        aria-label="The game screen"
      ></canvas>
      <div class="foot">
        <div id="sound"></div>
        <p id="note" aria-live="polite"></p>
        <div class="actions">
          <button id="start" type="button" disabled>Start run</button>
          <button id="pause" type="button" disabled>Pause</button>
          <button id="share" type="button" disabled>Share card</button>
        </div>
      </div>
      <div id="pad" class="pad" role="group" aria-label="Touch controls">
        <button type="button" data-hold="up" disabled aria-label="Up">▲</button>
        <button type="button" data-hold="down" disabled aria-label="Down">
          ▼
        </button>
        <button type="button" data-hold="left" disabled aria-label="Left">
          ◀
        </button>
        <button type="button" data-hold="right" disabled aria-label="Right">
          ▶
        </button>
        <button id="act" type="button" data-hold="act" disabled>Jump</button>
        <button type="button" data-hold="fire" disabled>Fire</button>
        <button type="button" data-hold="quick" disabled>Quick</button>
        <button type="button" data-hold="evade" disabled>Evade</button>
        <button type="button" data-hold="charm" disabled>Charm</button>
      </div>
      <section aria-labelledby="earned-title">
        <h2 id="earned-title">Earned this run</h2>
        <ul id="earned" aria-label="Milestones earned this run"></ul>
      </section>
    </main>
    <div
      id="card-panel"
      class="card-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="card-title"
      hidden
    >
      <div class="card-sheet">
        <div class="card-head">
          <h2 id="card-title">Your Pocket Dragon card</h2>
          <button id="card-close" type="button">Close</button>
        </div>
        <div class="card-shapes" role="group" aria-label="Card size">
          <button type="button" data-shape="square" aria-pressed="true">
            1:1 post
          </button>
          <button type="button" data-shape="story" aria-pressed="false">
            9:16 story
          </button>
          <button type="button" data-shape="wide" aria-pressed="false">
            16:9 wide
          </button>
        </div>
        <div id="card-holo" class="card-holo">
          <img id="card-image" alt="" hidden />
        </div>
        <p id="card-hint" class="card-hint" aria-live="polite"></p>
        <div id="card-link-row" class="card-link" hidden>
          <label for="card-link">Invite link</label>
          <input id="card-link" type="text" readonly />
        </div>
        <div class="card-actions">
          <button id="card-download" type="button">Download</button>
          <button id="card-send" type="button">Share</button>
          <button id="card-copy" type="button">Copy invite link</button>
        </div>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
