<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tap Tower</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Tap Tower</h1>
      <p id="status">Connecting to the platform…</p>
      <p>Score: <strong id="score">0</strong></p>
      <button id="tap" type="button" disabled>Tap</button>
      <button id="probe" type="button">Run safety probe</button>
      <ul id="unlocked" aria-label="Milestones you have unlocked"></ul>
      <pre id="probe-result" aria-live="polite"></pre>
    </main>
    <script src="main.js"></script>
  </body>
</html>
